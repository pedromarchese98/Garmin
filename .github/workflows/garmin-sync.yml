name: Sincronizar Garmin

on:
  schedule:
    # Horario en UTC: 07:17 y 20:47 de Argentina
    - cron: "17 10 * * *"
    - cron: "47 23 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "Días hacia atrás a sincronizar (usá 90 la primera vez)"
        default: "3"

concurrency:
  group: garmin-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Sincronizar
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SYNC_DAYS: ${{ github.event.inputs.days || '3' }}
        run: python garmin_sync.py
